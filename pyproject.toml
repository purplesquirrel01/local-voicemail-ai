[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voicemail-transcription"
version = "1.4.0"
description = "Portfolio reference implementation of local AI voicemail transcription and structured human review."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{name = "Local Voicemail Transcription contributors"}]
dependencies = [
  "requests==2.33.0",
  "watchdog==4.0.1",
]

[project.optional-dependencies]
portal = ["fastapi==0.141.1", "uvicorn[standard]==0.46.0"]
ai = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.46.0",
  "python-multipart==0.0.27",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.1",
  "nemo-toolkit[asr]==2.6.2",
  "torch==2.9.1",
  "litert-lm==0.13.1",
]
dev = [
  "build==1.3.0",
  "pytest==8.4.2",
  "ruff==0.12.11",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.46.0",
  "python-multipart==0.0.27",
  "httpx==0.28.1",
]

[project.scripts]
lvt-watcher = "watcher:main"
lvt-portal = "lvt_entrypoints:portal_main"
lvt-whisper-api = "lvt_entrypoints:whisper_main"
lvt-parakeet-api = "lvt_entrypoints:parakeet_main"
lvt-gemma-api = "lvt_entrypoints:gemma_main"

[tool.setuptools]
py-modules = [
  "watcher",
  "verification",
  "alignment",
  "asr_lattice",
  "asr_types",
  "adjudication",
  "agent_constraints",
  "candidate_extractor",
  "extraction_orchestrator",
  "final_resolver",
  "gemma_agents",
  "json_utils",
  "lvt_entrypoints",
  "litert_chat_web",
  "parakeet_server",
  "voicemail_portal",
  "whisper_server",
]
packages = [
  "lvt_assets",
  "prompts",
  "voicemail_common",
  "voicemail_watcher",
  "voicemail_portal_app",
  "voicemail_verification",
]

[tool.setuptools.package-data]
prompts = ["*.md"]
lvt_assets = ["*.svg"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"voicemail_portal.py" = ["E402"]
"watcher.py" = ["F811"]
